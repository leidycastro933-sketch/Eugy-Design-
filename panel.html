
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administración | EUGY DESIGN</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #dff2ff;
            font-family: Arial, sans-serif;
            padding: 25px;
        }

        .panel-contenedor {
            max-width: 1100px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border: 2px solid #e0ad32;
            border-radius: 18px;
        }

        .panel-encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .panel-encabezado h1 {
            color: #164d78;
        }

        .panel-contenedor h2 {
            color: #164d78;
        }

        .boton-panel {
            background: #164d78;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .lista-admin {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .producto-admin {
            border: 1px solid #e0ad32;
            border-radius: 12px;
            padding: 15px;
        }

        .producto-admin img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .producto-admin button {
            margin: 5px 3px;
        }

        #mensaje-panel {
            color: #164d78;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <main class="panel-contenedor">

        <header class="panel-encabezado">
            <h1>EUGY DESIGN</h1>
            <button id="cerrar-sesion" class="boton-panel">
                Cerrar sesión
            </button>
        </header>

        <h2>Panel de administración</h2>
        <p>Administra tus prendas, fotografías, precios y disponibilidad.</p>

        <button id="nuevo-producto" class="boton-panel">
            Agregar producto
        </button>

        <p id="mensaje-panel">Cargando productos...</p>

        <section id="lista-admin" class="lista-admin"></section>

        <a href="index.html">Volver a la tienda</a>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script src="panel.js"></script>

</body>
</html>
